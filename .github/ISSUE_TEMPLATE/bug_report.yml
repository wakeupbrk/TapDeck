name: Bug report
description: Report a reproducible problem with the Mac preview or phone controller.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Check the troubleshooting guide and existing issues first. This report is public: do not attach pairing URLs, QR codes, device identifiers, credentials or personal decks. Security vulnerabilities belong in private reporting.
  - type: input
    id: app-version
    attributes:
      label: TapDeck Mac version
      placeholder: "For example: 0.3.2"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac architecture
      placeholder: "For example: macOS version, Apple silicon or Intel"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Phone OS, browser version and browser/Home Screen mode
      placeholder: "If relevant; do not include device identifiers"
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a generic example without personal data.
      placeholder: "1. Open…
2. Choose…
3. Observe…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and what happened instead
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional screenshots or exact error text, checked and redacted before sharing.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I checked existing issues and removed sensitive information from this report.
          required: true
